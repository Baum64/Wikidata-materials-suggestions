# Fachliche Einschaetzungen je Bestandseintrag (Paket 0), PMDco.
#
# Getrennt von den Regeln in pmdmap/assessment.py: Eine Einschaetzung ersetzt
# nur den VORSCHLAG in der Pruef-Tabelle (Spalten vorschlag, vorschlag_p4390)
# und haengt ihre Begruendung als "Einschaetzung: ..." an. Die Regel-Befunde
# bleiben sichtbar. Entschieden wird ausschliesslich in der Pruef-Tabelle.
#
# Schluessel: QID. Felder:
#   vorschlag:   behalten | P4390 ergänzen | umstellen auf P2888+P4390 | entfernen | offen
#   p4390:       englisches Label eines laut Constraint erlaubten Werts (z. B. close match)
#                Richtung laut Constraint-Beschreibung: "narrow match" = die
#                Ontologieklasse ist ENGER als der Wikidata-Eintrag, "broad
#                match" = sie ist WEITER.
#   grenzfall:   true/false - steuert den Eintrag in review-needed.md
#   iri:         nur noetig, wenn der Eintrag mehrere PMD-Abbildungen traegt
#   begruendung: kurz, mit Bezug auf die Definitionen
#
# Stand: PMDco 3.1.2, Wikidata 19.11.2026. Erstellt vom Agenten nach Vergleich
# von Wikidata-Beschreibung/Aliassen und PMD-Definition.

# --- Werkstoffe ---------------------------------------------------------------
Q11426:
  vorschlag: umstellen auf P2888+P4390
  p4390: close match
  grenzfall: true
  begruendung: >-
    Doppelt genutzter Eintrag - de-Beschreibung "Gruppe chemischer Elemente",
    en "element, compound, or alloy ...". PMD "metal" ist rein werkstofflich
    (Leitfaehigkeit, Duktilitaet, metallische Bindung). Volle Deckung nur,
    wenn Q11426 als Werkstoffklasse gilt; dient er Elementen auch als
    Kategorie (periodic-table-conventions Fall 2), ist close match ehrlicher.
Q670:
  p4390: close match
  begruendung: >-
    Q670 ist das chemische Element, PMD "portion of silicon" eine Stoffportion
    aus reinem Si. Kein exaktes Gegenstueck; close match pragmatisch (Q670 wird
    in Wikidata auch fuer den Stoff benutzt), streng genommen related match.
Q271449:
  vorschlag: umstellen auf P2888+P4390
  p4390: close match
  begruendung: >-
    Wikidata: "metallic chemical element" - nur Elemente. PMD "precious metal"
    ist eine Werkstoffklasse (metal), schliesst damit auch Edelmetall-
    Legierungen ein. Gleicher Begriffskern, anderer Umfang.
Q527601:
  vorschlag: umstellen auf P2888+P4390
  p4390: broad match
  begruendung: >-
    Abgebildet auf PMD "amorphous material" (jedes Material mit
    Nahordnung, also auch Glas, amorphe Polymere) - weiter als "metallisches
    Glas". PMDco hat dafuer eine eigene Klasse "amorphous metal glass"
    (PMD_0050149) - Kandidat fuer P1709 in Paket 1.

